repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix]
  - repo: local
    hooks:
      - id: commit-message-policy
        name: commit message policy (type(scope): subject, crypto scope rule)
        entry: python3 scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
      - id: block-key-material
        name: block committed CKKS key material
        entry: python3 -c "import sys; sys.exit(1 if sys.argv[1:] else 0)"
        language: system
        files: '\.(ctx|key|pem)$'
