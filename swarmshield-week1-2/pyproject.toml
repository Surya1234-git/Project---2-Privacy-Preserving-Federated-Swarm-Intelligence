[project]
name = "swarmshield"
version = "0.2.0"
description = "SwarmShield - privacy-preserving federated learning over a simulated edge swarm (FedAvg + CKKS homomorphic aggregation)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "tenseal>=0.3.15",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: spins up a real aggregator + edge-node processes on localhost (slower)",
]
addopts = "-q"
